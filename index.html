<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Typing Game | Version 01</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #25204a 0%, #11111f 45%, #080810 100%);
            color: #ffffff;
            font-family:
                "Segoe UI",
                "Microsoft JhengHei",
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            text-align: center;
        }

        .version {
            color: #8f8cff;
            font-size: 14px;
            letter-spacing: 4px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: 48px;
            letter-spacing: 2px;
        }

        .subtitle {
            margin-top: 15px;
            color: #aaa9bd;
            font-size: 16px;
        }

        .game-card {
            margin-top: 45px;
            padding: 50px 30px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(143, 140, 255, 0.25);
            border-radius: 20px;

            box-shadow:
                0 0 40px rgba(104, 92, 255, 0.12),
                inset 0 0 30px rgba(255, 255, 255, 0.02);
        }

        .keyboard-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .instruction {
            color: #c4c3d4;
            margin-bottom: 30px;
        }

        .start-btn {
            border: none;
            border-radius: 12px;
            padding: 14px 38px;

            background: linear-gradient(
                135deg,
                #7c6cff,
                #a66cff
            );

            color: white;
            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 0 20px rgba(124, 108, 255, 0.35);

            transition: all 0.25s ease;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow:
                0 0 30px rgba(124, 108, 255, 0.6);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        footer {
            margin-top: 35px;
            color: #666579;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }

            .game-card {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="version">
            TYPING GAME · VERSION 01
        </div>

        <h1>英打遊戲</h1>

        <p class="subtitle">
            Test your typing speed.
        </p>

        <div class="game-card">

            <div class="keyboard-icon">
                ⌨️
            </div>

            <p class="instruction">
                準備好挑戰你的英文打字能力了嗎？
            </p>

            <!-- 任務一：按鈕暫時不需要功能 -->
            <button class="start-btn">
                開始遊戲
            </button>

        </div>

        <footer>
            VERSION 01 · 2026
        </footer>

    </div>

</body>
</html>
